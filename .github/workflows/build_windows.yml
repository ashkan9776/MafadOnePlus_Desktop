name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\windows\x64\runner\Release\platform-tools
          Copy-Item -Path assets\platform-tools-windows\* -Destination build\windows\x64\runner\Release\platform-tools\ -Recurse -Force
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath MafadOnePlus_Windows_Release.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MafadOnePlus-Windows-Release
          path: MafadOnePlus_Windows_Release.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev zip

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          cd build/linux/x64/release/bundle/
          zip -r ../../../../MafadOnePlus_Linux_Release.zip .

      - name: Upload Linux Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MafadOnePlus-Linux-Release
          path: MafadOnePlus_Linux_Release.zip

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: MafadOnePlus-Windows-Release

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: MafadOnePlus-Linux-Release

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "مفاد وان پلاس دسکتاپ | Mafad One Plus Desktop v1.0.0"
          body: |
            ## 🌟 نسخه نهایی Mafad One Plus Desktop Pro (نسخه 1.0.0)

            نرم‌افزار مدیریت هوشمند و خودکار Device Owner و اعطا/سلب دسترسی به اپلیکیشن همراه با نصب خودکار APK.

            ### 📦 فایل‌های قابل دانلود:
            - **`MafadOnePlus_Windows_Release.zip`**: نسخه کامل و پرتابل ویندوز (شامل adb.exe پرتابل و بدون نیاز به نصب هیچ پیش‌نیازی)
            - **`MafadOnePlus_Linux_Release.zip`**: نسخه کامل و مستقل لینوکس (x64)
          files: |
            MafadOnePlus_Windows_Release.zip
            MafadOnePlus_Linux_Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
