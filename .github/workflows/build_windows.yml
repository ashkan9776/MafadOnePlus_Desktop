name: Build Windows Application

on:
  push:
    branches: [ main, master, desktop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath MafadOnePlus_Windows_Release.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MafadOnePlus-Windows-Release
          path: MafadOnePlus_Windows_Release.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v1.0
          name: "Mafad One Plus Desktop Windows v1.0"
          body: "نسخه نهایی و آماده اجرای ویندوز مفاد وان پلاس (Mafad One Plus Desktop Pro)"
          files: MafadOnePlus_Windows_Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
